title: Cloud Instance Metadata Credential Harvest from Compromised Workload
id: 7a3e0e2c-8f1b-4d9a-9c7e-1a2b3c4d5e6f
status: experimental
description: >
  Detects a workload process querying the cloud instance metadata service (IMDS)
  for credentials shortly after an anomalous local file read or code-execution event —
  the pattern used in the sandbox-escape → metadata-harvest chain covered in
  case-studies/03-agentic-sandbox-escape-breach.
references:
  - https://attack.mitre.org/techniques/T1552/005/
author: DreamTeam-10 AI Security Governance
date: 2026/08/10
tags:
  - attack.credential_access
  - attack.t1552.005
logsource:
  category: network_connection
  product: cloud
detection:
  metadata_request:
    dst_ip: '169.254.169.254'
    # AWS/GCP/Azure IMDS endpoint. On AWS, also check for IMDSv1 (no token header)
    # vs IMDSv2 (token-based) — an IMDSv1 request from a workload that should be
    # IMDSv2-only is itself worth a separate, lower-threshold alert.
  suspicious_process_context:
    # Correlate with the process that issued the request, not just the network flow.
    process_parent|contains:
      - 'dataset-processor'
      - 'jinja2'
      - 'template-render'
    file_operations|contains:
      - '/proc/self/environ'
      - '.h5'
      - '.hdf5'
  condition: metadata_request and suspicious_process_context
falsepositives:
  - Legitimate application startup that reads IMDS for its own role credentials.
    Baseline expected IMDS-calling processes per workload and alert only on
    processes outside that baseline.
level: high
---
# Companion note (not part of the Sigma rule):
# Pair this detection with an IMDSv2-only enforcement policy at the instance/pod
# level — the detection catches an attempt in progress, IMDSv2 enforcement
# prevents a whole class of these attempts from succeeding at all. Detection
# without the enforcing control is a lagging indicator, not a defense.
